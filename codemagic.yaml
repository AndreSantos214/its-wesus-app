workflows:
  ios-capacitor-release:
    name: iOS Capacitor Release
    max_build_duration: 60
    instance_type: mac_mini_m2[span_0](start_span)[span_0](end_span)

    integrations:
      app_store_connect: ios-app[span_1](start_span)[span_1](end_span)

    environment:
      node: latest[span_2](start_span)[span_2](end_span)
      xcode: latest[span_3](start_span)[span_3](end_span)
      cocoapods: default[span_4](start_span)[span_4](end_span)

      ios_signing:
        distribution_type: app_store[span_5](start_span)[span_5](end_span)
        bundle_identifier: "com.itswesus.portal[span_6](start_span)[span_7](start_span)"[span_6](end_span)[span_7](end_span)

      vars:
        BUNDLE_ID: "com.itswesus.portal[span_8](start_span)[span_9](start_span)"[span_8](end_span)[span_9](end_span)
        APP_NAME: "It's Wesus[span_10](start_span)[span_11](start_span)"[span_10](end_span)[span_11](end_span)
        APP_VERSION: "2.0.5[span_12](start_span)"[span_12](end_span)
        IOS_DEPLOYMENT_TARGET: "15.0[span_13](start_span)[span_14](start_span)"[span_13](end_span)[span_14](end_span)
        XCODE_WORKSPACE: "ios/App/App.xcworkspace[span_15](start_span)"[span_15](end_span)
        XCODE_SCHEME: "App[span_16](start_span)"[span_16](end_span)

    scripts:
      - name: Install npm dependencies
        script: |
          echo "Installing npm dependencies..."

          if [ -f package-lock.json ]; then
            npm ci || npm install
          else
            npm install
          fi

          chmod -R +x node_modules/.bin || true

      - name: Generate App Icons and Splash
        script: |
          echo "Generating app icons and splash screens..."
          npx capacitor-assets generate --ios

      - name: Sync Capacitor iOS
        script: |
          echo "Syncing Capacitor iOS..."
          npx cap sync ios

      - name: Validate iOS project files
        script: |
          echo "Validating iOS project..."

          if [ ! -d "ios/App" ]; then
            echo "ERROR: ios/App folder not found."
            exit 1
          fi

          if [ ! -f "ios/App/Podfile" ]; then
            echo "ERROR: ios/App/Podfile file not found."
            exit 1
          fi

          if [ -d "ios/App/Podfile" ]; then
            echo "ERROR: ios/App/Podfile is a directory, but it must be a file."
            exit 1
          fi

          echo "iOS project looks OK."

      - name: Force iOS deployment target
        script: |
          echo "Forcing iOS deployment target to ${IOS_DEPLOYMENT_TARGET}..."

          ruby -pi -e "gsub(/platform :ios, '[0-9.]+'/, \"platform :ios, '${IOS_DEPLOYMENT_TARGET}'\")" ios/App/Podfile

          echo "Podfile:"
          cat ios/App/Podfile

      - name: Install CocoaPods dependencies
        script: |
          echo "Installing CocoaPods dependencies..."
          cd ios/App
          pod install --repo-update

      - name: Set app version and build number
        script: |
          echo "Setting app version and build number..."
          cd ios/App

          BUILD_NUMBER_VALUE="${BUILD_NUMBER:-1}"

          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${APP_VERSION}" App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${APP_VERSION}" App/Info.plist

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUMBER_VALUE}" App/Info.plist || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${BUILD_NUMBER_VALUE}" App/Info.plist

          echo "Version: ${APP_VERSION}"
          echo "Build number: ${BUILD_NUMBER_VALUE}"

      - name: Initialize keychain
        script: |
          echo "Initializing keychain..."
          keychain initialize

      - name: Add signing certificates to keychain
        script: |
          echo "Adding signing certificates to keychain..."
          keychain add-certificates

      - name: Apply provisioning profiles to Xcode project
        script: |
          echo "Applying provisioning profiles..."
          xcode-project use-profiles

      - name: Build IPA
        script: |
          echo "Building IPA..."
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa[span_17](start_span)[span_17](end_span)
      - /tmp/xcodebuild_logs/*.log[span_18](start_span)[span_18](end_span)
      - ios/App/build/**/*.xcarchive[span_19](start_span)[span_19](end_span)

    publishing:
      app_store_connect:
        auth: integration[span_20](start_span)[span_20](end_span)
        submit_to_testflight: false[span_21](start_span)[span_21](end_span)
        
